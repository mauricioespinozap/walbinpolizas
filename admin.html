        window.procesarArchivoUniversal = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            let textoExtraido = "";
            const dropzoneText = document.getElementById('dropzoneText');
            dropzoneText.innerHTML = `⏳ Analizando <strong>${file.name}</strong>...`;

            try {
                if (['xlsx', 'xls'].includes(extension)) {
                    await leerExcelUniversal(file);
                    dropzoneText.innerHTML = `📁 Cargar Documento (Excel, Word, PDF, Imagen)`;
                    return;
                } else if (extension === 'docx') {
                    textoExtraido = await leerWord(file);
                } else if (extension === 'pdf') {
                    textoExtraido = await leerPDF(file);
                } else if (['png', 'jpg', 'jpeg'].includes(extension)) {
                    textoExtraido = await leerImagenOCR(file);
                } else {
                    alert("Formato no soportado.");
                    dropzoneText.innerHTML = `📁 Cargar Documento (Excel, Word, PDF, Imagen)`;
                    return;
                }

                if (textoExtraido) {
                    document.getElementById('observaciones').value = `[Extraído de ${file.name}]:\n` + textoExtraido.substring(0, 500);
                    alert(`¡Información extraída exitosamente de ${file.name}!\nSe ha incorporado al campo de observaciones.`);
                }
                dropzoneText.innerHTML = `📁 Cargar Documento (Excel, Word, PDF, Imagen)`;
            } catch (error) {
                alert("Error al procesar el archivo: " + (error.message || error));
                dropzoneText.innerHTML = `📁 Cargar Documento (Excel, Word, PDF, Imagen)`;
            }
        };

        async function leerWord(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return result.value;
        }

        async function leerPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let textoCompleto = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const textItems = textContent.items.map(item => item.str);
                textoCompleto += textItems.join(" ") + "\n";
            }
            return textoCompleto;
        }

        async function leerImagenOCR(file) {
            const result = await Tesseract.recognize(file, 'spa');
            return result.data.text;
        }

        async function leerExcelUniversal(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames.includes('Vigencias') ? 'Vigencias' : workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });

                let count = 0;
                for (let i = 5; i < rows.length; i++) {
                    let r = rows[i];
                    if (!r || !r[6]) continue;

                    let nuevaPoliza = {
                        Número: String(r[6] || '').trim(),
                        Cliente: String(r[2] || 'CENTRO MEDICO SAN RAFAEL ARCANGEL S.A.').trim(),
                        Aseguradora: 'I.N.S.',
                        Tipo: String(r[4] || 'Otros').toUpperCase().includes('VEHIC') ? 'Vehiculo' : 
                              String(r[4] || '').toUpperCase().includes('VIVIENDA') || String(r[4] || '').toUpperCase().includes('INCENDIO') ? 'Vivienda' : 'Otros',
                        DetalleTipo: String(r[9] || '').trim(),
                        MontoPagar: parseFloat(r[7]) || 0,
                        MonedaPagar: '¢',
                        Frecuencia: String(r[5] || 'Anual').trim(),
                        Estado: 'Activa',
                        Observaciones: `Método cobro: ${String(r[8] || 'COBROS')}`
                    };

                    const { error } = await db.from('Polizas').insert([nuevaPoliza]);
                    if (!error) count++;
                }
                alert(`¡Se han importado ${count} pólizas exitosamente desde el Excel!`);
                cargarPolizas();
            };
            reader.readAsArrayBuffer(file);
        }

        window.guardarPoliza = async function(e) {
            e.preventDefault();

            const idEditando = document.getElementById('idEditando').value;
            btn.textContent = 'Guardando en la nube...';
            btn.disabled = true;

            const tipoSeleccionado = document.getElementById('tipo').value;
            let detalleAdicional = '';

            if (tipoSeleccionado === 'Vehiculo') {
                detalleAdicional = document.getElementById('detallePlaca')?.value.trim() || '';
            } else if (tipoSeleccionado === 'Vivienda') {
                detalleAdicional = document.getElementById('detalleFinca')?.value.trim() || '';
            } else if (tipoSeleccionado === 'Otros') {
                detalleAdicional = document.getElementById('detalleOtro')?.value.trim() || '';
            }

            const frecuenciaSeleccionada = document.getElementById('frecuencia').value;
            let frecuenciaFinal = frecuenciaSeleccionada;
            if (frecuenciaSeleccionada === 'Otros') {
                const detalleFreq = document.getElementById('detalleFrecuenciaOtro')?.value.trim();
                if (detalleFreq) frecuenciaFinal = `Otros: ${detalleFreq}`;
            }

            const monedaSeleccionada = document.getElementById('monedaPagar').value;
            let monedaFinal = monedaSeleccionada;
            if (monedaSeleccionada === 'Otros') {
                const detalleMoneda = document.getElementById('detalleMonedaOtro')?.value.trim();
                if (detalleMoneda) monedaFinal = detalleMoneda;
            }

            const datosParaGuardar = {
                Número: document.getElementById('numero').value,
                Cliente: document.getElementById('cliente').value.trim(),
                Aseguradora: document.getElementById('aseguradora').value,
                Tipo: tipoSeleccionado,
                MontoPoliza: parseFloat(document.getElementById('montoPoliza').value) || 0,
                MontoPagar: parseFloat(document.getElementById('montoPagar').value) || 0,
                MonedaPagar: monedaFinal,
                Frecuencia: frecuenciaFinal,
                FechaVencimiento: document.getElementById('vencimiento').value,
                Estado: document.getElementById('estado').value,
                Beneficiario1: document.getElementById('beneficiario1').value.trim(),
                Beneficiario2: document.getElementById('beneficiario2').value.trim(),
                Beneficiario3: document.getElementById('beneficiario3').value.trim()
            };

            const valorPolizaVal = document.getElementById('valorPoliza').value.trim();
            const observacionesVal = document.getElementById('observaciones').value.trim();
            const emisionVal = document.getElementById('emision').value;

            if (valorPolizaVal) datosParaGuardar.ValorPoliza = valorPolizaVal;
            if (detalleAdicional) datosParaGuardar.DetalleTipo = detalleAdicional;
            
            let obsFinal = observacionesVal;
            if (emisionVal) {
                obsFinal = `[Emisión: ${emisionVal}] ` + obsFinal;
            }
            if (obsFinal) datosParaGuardar.Observaciones = obsFinal;

            try {
                if (idEditando && !String(idEditando).startsWith('bcr-')) {
                    const { error } = await db.from('Polizas').update(datosParaGuardar).eq('id', idEditando);
                    if (error) throw error;
                    document.getElementById('idEditando').value = '';
                } else {
                    const { error } = await db.from('Polizas').insert([datosParaGuardar]);
                    if (error) throw error;
                }

                document.getElementById('polizaForm').reset();
                document.getElementById('contenedorDinamicoTipo').innerHTML = '';
                document.getElementById('contenedorDinamicoFrecuencia').innerHTML = '';
                document.getElementById('contenedorMonedaOtro').innerHTML = '';
                cargarPolizas();
                alert('¡Póliza guardada exitosamente!');

                alert("Error al guardar: " + (error.message || error));
            } finally {
                btn.textContent = 'Guardar Registro';
                btn.disabled = false;
            }
        };

        function actualizarFiltroTitulares() {
            const selectFiltro = document.getElementById('filtroTitular');
            const valorActual = selectFiltro.value;
            const titularesSet = new Set();
            todasLasPolizas.forEach(p => { if (p.Cliente) titularesSet.add(p.Cliente.trim()); });

            let listaTitulares = Array.from(titularesSet);
            let opcionesHTML = `<option value="TODOS">-- Todos los Titulares --</option>`;
            listaTitulares.forEach(t => { opcionesHTML += `<option value="${t}">${t}</option>`; });
            selectFiltro.innerHTML = opcionesHTML;
            if (valorActual) selectFiltro.value = valorActual;
        }

            contenedor.innerHTML = '';

                let filasHTML = '';

                    let badgeClass = 'badge-vigente';
                    let estadoTexto = p.Estado || 'Activa';

                    if (fechaVen && fechaVen < hoy && estadoBD !== 'pendiente' && estadoBD !== 'en tramite' && estadoBD !== 'inactiva') {
                        estadoTexto = 'Vencida';
                        badgeClass = 'badge-vencida';
                    } else if (estadoBD.includes('pendiente')) {
                        estadoTexto = 'Pendiente';
                        badgeClass = 'badge-pendiente';
                    } else if (estadoBD.includes('tramite')) {
                        estadoTexto = 'En trámite';
                        badgeClass = 'badge-tramite';
                    } else if (estadoBD.includes('inactiva') || estadoBD.includes('vencida')) {
                        estadoTexto = 'Inactiva';
                        badgeClass = 'badge-vencida';
                    } else {
                        estadoTexto = 'Activa';
                        badgeClass = 'badge-vigente';
                    }

                    let estadoHTML = `<span class="badge ${badgeClass}">${estadoTexto}</span>`;

                    let detalleTipoHTML = '';
                    if (p.DetalleTipo) {
                        let etiquetaDetalle = 'Detalle';
                        if (p.Tipo === 'Vehiculo') etiquetaDetalle = 'Placa';
                        else if (p.Tipo === 'Vivienda') etiquetaDetalle = 'Finca';
                        detalleTipoHTML = `<br><small style="color: var(--text-light);">${etiquetaDetalle}: ${p.DetalleTipo}</small>`;
                    }

                    let fechaEmiMostrar = 'N/D';
                    let obsLimpia = p.Observaciones || '';
                    if (obsLimpia.startsWith('[Emisión:')) {
                        let finCorchete = obsLimpia.indexOf(']');
                        fechaEmiMostrar = obsLimpia.substring(9, finCorchete).trim();
                        obsLimpia = obsLimpia.substring(finCorchete + 1).trim();
                    }

                    let listaBens = [p.Beneficiario1, p.Beneficiario2, p.Beneficiario3].filter(Boolean);
                    let beneficiarioTexto = listaBens.length > 0 ? listaBens.join(', ') : 'No especificado';
                    let valorPagaTexto = p.ValorPoliza || (p.MontoPoliza ? `${p.MonedaPagar || '¢'} ${p.MontoPoliza.toLocaleString()}` : 'No especificado');

                    filasHTML += `
                        <tr>
                            <td>
                                <strong style="color: #fff;">N°: ${p.Número || 'S/N'}</strong><br>
                                <small style="color: var(--text-light);">Aseguradora: ${p.Aseguradora || 'N/A'}</small><br>
                                <span style="color: var(--accent); font-weight: 500;">${p.Cliente}</span>
                            </td>
                            <td>
                                <strong style="color: #e2e8f0;">${p.Tipo}</strong>${detalleTipoHTML}
                            </td>
                            <td>
                                <strong style="color: #38bdf8;">${p.MonedaPagar || '¢'} ${(p.MontoPagar || 0).toLocaleString()}</strong><br>
                                <span class="badge badge-freq">${p.Frecuencia}</span>
                            </td>
                            <td>
                                <small style="color: var(--text-light);">Emisión: ${fechaEmiMostrar}</small><br>
                                <strong style="color: #e2e8f0;">Venc: ${fechaVen}</strong><br>
                                (${estadoHTML})
                            </td>
                            <td>
                                <div style="font-size: 0.8rem; margin-bottom: 4px; color: #cbd5e1;"><strong>Cobertura:</strong> ${valorPagaTexto}</div>
                                <div style="font-size: 0.8rem; margin-bottom: 4px; color: #cbd5e1;"><strong>Beneficiarios:</strong> ${beneficiarioTexto}</div>
                                <div style="font-size: 0.8rem; color: var(--text-light);"><strong>Obs:</strong> ${obsLimpia || 'Ninguna'}</div>
                            </td>
                            <td class="no-print" style="text-align: right;">
                                <button class="btn-action btn-edit" onclick="editarPoliza('${p.id}')">Editar</button>
                                <button class="btn-action btn-del" onclick="eliminarPoliza('${p.id}')">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });

                cardDiv.innerHTML = `
                    <div class="card-header">
                        <span>Titular: ${titular}</span>
                        <span class="badge-count">${polizasGrupo.length} póliza(s)</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Identificador</th>
                                        <th>Tipo</th>
                                        <th>Pago / Prima</th>
                                        <th>Fechas / Estado</th>
                                        <th>Detalles</th>
                                        <th class="no-print" style="text-align: right;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>${filasHTML}</tbody>
                            </table>
                        </div>
                    </div>
                `;
                contenedor.appendChild(cardDiv);
            });
        };

        window.imprimirTodo = function() {
            document.getElementById('filtroTitular').value = 'TODOS';
            renderizarTablas();
            window.print();
        };

        window.imprimirTitularActual = function() {
            const titular = document.getElementById('filtroTitular').value;
            if (titular === 'TODOS') {
                alert('Por favor, seleccione un titular específico en el menú desplegable para imprimir solo su información.');
                return;
            }
            window.print();
        };

        window.editarPoliza = function(id) {
            let p = todasLasPolizas.find(item => item.id == id);
            if (!p) return;
            cargarFormularioEdicion(p);
        };

        function cargarFormularioEdicion(p) {
            document.getElementById('idEditando').value = p.id;
            document.getElementById('numero').value = p.Número || '';
            document.getElementById('cliente').value = p.Cliente || '';
            document.getElementById('aseguradora').value = p.Aseguradora || '';
            document.getElementById('tipo').value = p.Tipo || 'Vida';
            manejarTipoPoliza();
            
            setTimeout(() => {
                if (p.Tipo === 'Vehiculo' && document.getElementById('detallePlaca')) {
                    document.getElementById('detallePlaca').value = p.DetalleTipo || '';
                } else if (p.Tipo === 'Vivienda' && document.getElementById('detalleFinca')) {
                    document.getElementById('detalleFinca').value = p.DetalleTipo || '';
                } else if (p.Tipo === 'Otros' && document.getElementById('detalleOtro')) {
                    document.getElementById('detalleOtro').value = p.DetalleTipo || '';
                }
            }, 50);

            document.getElementById('montoPoliza').value = p.MontoPoliza || '';
            document.getElementById('valorPoliza').value = p.ValorPoliza || '';
            document.getElementById('montoPagar').value = p.MontoPagar || '';
            document.getElementById('vencimiento').value = p.FechaVencimiento || '';
            document.getElementById('estado').value = p.Estado || 'Activa';
            document.getElementById('beneficiario1').value = p.Beneficiario1 || '';
            document.getElementById('beneficiario2').value = p.Beneficiario2 || '';
            document.getElementById('beneficiario3').value = p.Beneficiario3 || '';
            
            let obsRaw = p.Observaciones || '';
            if (obsRaw.startsWith('[Emisión:')) {
                let fin = obsRaw.indexOf(']');
                document.getElementById('emision').value = obsRaw.substring(9, fin).trim();
                document.getElementById('observaciones').value = obsRaw.substring(fin + 1).trim();
            } else {
                document.getElementById('emision').value = '';
                document.getElementById('observaciones').value = obsRaw;
            }

            document.getElementById('btnGuardar').textContent = 'Actualizar Registro';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.eliminarPoliza = async function(id) {
            if (confirm('¿Desea eliminar este registro?')) {
                if (String(id).startsWith('bcr-')) {
                    todasLasPolizas = todasLasPolizas.filter(item => item.id !== id);
                    renderizarTablas();
                } else {
                    await db.from('Polizas').delete().eq('id', id);
                    cargarPolizas();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            manejarTipoPoliza();
            cargarPolizas();
            document.getElementById('polizaForm').addEventListener('submit', window.guardarPoliza);
        });
    </script>

    <style>
        :root {
            --bg: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-header: rgba(15, 23, 42, 0.9);
            --primary: #38bdf8;
            --accent: #00bcd4;
            --accent-magenta: #ec4899;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #f43f5e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #0f172a 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-attachment: fixed;
        }

        .header-main {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .header-content h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 2.2rem;
            background: linear-gradient(90deg, #38bdf8, #00bcd4, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-logo { height: 50px; width: auto; object-fit: contain; filter: drop-shadow(0 0 8px rgba(0,188,212,0.4)); }

        .container { max-width: 1450px; margin: 25px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        .dashboard-grid { display: grid; grid-template-columns: 360px 1fr; gap: 25px; }

        @media (max-width: 992px) { 
            .dashboard-grid { grid-template-columns: 1fr; display: flex; flex-direction: column; } 
            .header-main { flex-direction: column; gap: 10px; }
            .filter-bar { flex-direction: column; align-items: stretch !important; }
            .filter-bar > div { margin-left: 0 !important; width: 100%; justify-content: space-between; }
            .filter-bar select { max-width: 100% !important; }
        }

        /* Tarjetas estilo Dashboard Holográfico/Glasmorfismo */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            border-radius: 12px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            margin-bottom: 25px;
        }

        .card-header { 
            background: var(--card-header); 
            color: var(--text); 
            padding: 16px 20px; 
            font-family: 'Playfair Display', serif; 
            font-size: 1.1rem; 
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body { padding: 20px; }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-weight: 500; font-size: 0.78rem; margin-bottom: 6px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control, .form-select { 
            width: 100%; 
            padding: 9px 12px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0,188,212,0.25);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn { padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; width: 100%; transition: all 0.3s; }
        
        .btn-primary { 
            background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%); 
            color: white; 
            box-shadow: 0 4px 15px rgba(0,188,212,0.3);
        }
        .btn-primary:hover { 
            filter: brightness(1.15);
            box-shadow: 0 6px 20px rgba(0,188,212,0.5);
        }

        .btn-action { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; }
        .btn-edit { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .btn-edit:hover { background: rgba(56, 189, 248, 0.25); }
        .btn-del { background: rgba(244, 63, 94, 0.1); color: var(--danger); border-color: rgba(244, 63, 94, 0.3); }
        .btn-del:hover { background: rgba(244, 63, 94, 0.25); }

        .btn-print { 
            background: rgba(15, 23, 42, 0.8); 
            color: var(--text); 
            border: 1px solid var(--border);
            border-radius: 8px;
            width: auto; 
            padding: 8px 14px; 
            font-size: 0.82rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-print:hover { background: rgba(0,188,212,0.15); border-color: var(--accent); color: var(--accent); }

        /* Zona de carga estilo Neón moderno */
        .dropzone-container {
            border: 2px dashed rgba(0,188,212,0.3);
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 18px;
        }
        .dropzone-container:hover {
            border-color: var(--accent);
            background: rgba(0,188,212,0.08);
            box-shadow: 0 0 15px rgba(0,188,212,0.15);
        }
        .dropzone-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .dropzone-icon { font-size: 1.6rem; margin-bottom: 4px; display: block; }
        .dropzone-text { font-size: 0.8rem; color: var(--text); font-weight: 500; }
        .dropzone-hint { font-size: 0.68rem; color: var(--text-light); margin-top: 2px; }

        .filter-bar { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            padding: 15px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 25px; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-wrap: wrap; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; min-width: 850px; }
        
        th { background: rgba(15, 23, 42, 0.9); color: var(--primary); font-family: 'Playfair Display', serif; padding: 12px 15px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-vigente { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-vencida { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-pendiente { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-tramite { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-freq { background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid var(--border); }
        .badge-count { background: rgba(0,188,212,0.2); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid rgba(0,188,212,0.4); }

        footer { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(12px);
            color: var(--text-light); 
            text-align: center; 
            padding: 20px; 
            border-top: 1px solid var(--border); 
            font-size: 0.85rem; 
        }
        
        @media print {
            body { background: white !important; color: black !important; }
            .dashboard-grid > div:first-child, .filter-bar .no-print, footer, header { display: none !important; }
            .dashboard-grid { display: block !important; }
            .card { border: 1px solid #ccc !important; box-shadow: none !important; background: white !important; }
            .card-header { background: #0a2540 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th { background: #f8f9fa !important; color: #0a2540 !important; }
            td { color: #2c3e50 !important; border-bottom: 1px solid #ddd !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <header class="header-main">
        <img src="golo.png" alt="Logo WSS" class="header-logo">
        <div class="header-content">
            <h1>Walbin Sánchez Enterprises</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-light); font-size: 0.9rem; letter-spacing: 1px;">SISTEMA DE CONTROL Y GESTIÓN DE PÓLIZAS</p>
        </div>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header"><span>Gestión de Póliza</span></div>
                <div class="card-body">
                    <!-- Zona de Carga Universal Estilo Dashboard -->
                    <div class="dropzone-container">
                        <input type="file" id="archivoUniversal" class="dropzone-input" accept=".xlsx, .xls, .docx, .pdf, .png, .jpg, .jpeg" onchange="procesarArchivoUniversal(event)">
                        <span class="dropzone-icon">⚡</span>
                        <div class="dropzone-text" id="dropzoneText">Importar Documento / OCR</div>
                        <div class="dropzone-hint">Excel, Word, PDF o Imagen compatible</div>
                    </div>

                    <form id="polizaForm">
                        <input type="hidden" id="idEditando">
                        <div class="form-group"><label class="form-label">Número de Póliza</label><input type="text" class="form-control" id="numero" required></div>
                        <div class="form-group"><label class="form-label">Titular / Cliente</label><input type="text" class="form-control" id="cliente" required></div>
                        <div class="form-group"><label class="form-label">Aseguradora</label><input type="text" class="form-control" id="aseguradora"></div>
                        <div class="form-group">
                            <label class="form-label">Tipo de Póliza</label>
                            <select class="form-select" id="tipo" onchange="manejarTipoPoliza()">
                                <option value="Vida">Vida</option>
                                <option value="Vehiculo">Vehiculo</option>
                                <option value="Vivienda">Vivienda</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div id="contenedorDinamicoTipo"></div>
                        <div class="form-group"><label class="form-label">Monto de la Póliza (Lo que paga)</label><input type="text" class="form-control" id="valorPoliza" placeholder="Ej. $100,000 o Cobertura total"></div>
                        <div class="form-group"><label class="form-label">Valor Numérico (Opcional)</label><input type="number" step="0.01" class="form-control" id="montoPoliza" placeholder="Solo para cálculos internos"></div>
                        <div class="form-group">
                            <label class="form-label">Monto a Pagar (Prima)</label>
                            <div style="display: flex; gap: 6px;">
                                <select class="form-select" id="monedaPagar" onchange="manejarMonedaPagar()" style="width: 85px;"><option value="¢">₡</option><option value="$">$</option><option value="Otros">Otro</option></select>
                                <input type="number" step="0.01" class="form-control" id="montoPagar" style="flex: 1;">
                            </div>
                        </div>
                        <div id="contenedorMonedaOtro"></div>
                        <div class="form-group">
                            <label class="form-label">Frecuencia de Pago</label>
                            <select class="form-select" id="frecuencia" onchange="manejarFrecuenciaPago()">
                                <option value="Mensual">Mensual</option><option value="Trimestral">Trimestral</option><option value="Semestral">Semestral</option><option value="Anual">Anual</option><option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div id="contenedorDinamicoFrecuencia"></div>
                        <div class="form-group"><label class="form-label">Fecha de Emisión</label><input type="date" class="form-control" id="emision"></div>
                        <div class="form-group"><label class="form-label">Fecha de Vencimiento</label><input type="date" class="form-control" id="vencimiento" required></div>
                        <div class="form-group">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="estado">
                                <option value="Activa">Activa</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="En trámite">En trámite</option>
                                <option value="Inactiva">Inactiva (Vencida)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Beneficiarios</label>
                            <input type="text" class="form-control" id="beneficiario1" placeholder="Beneficiario 1">
                            <input type="text" class="form-control" id="beneficiario2" placeholder="Beneficiario 2" style="margin-top:4px;">
                            <input type="text" class="form-control" id="beneficiario3" placeholder="Beneficiario 3" style="margin-top:4px;">
                        </div>
                        <div class="form-group"><label class="form-label">Observaciones</label><textarea class="form-control" id="observaciones" rows="3"></textarea></div>
                        <button type="submit" id="btnGuardar" class="btn btn-primary" style="margin-top: 5px;">Guardar Registro</button>
                    </form>
                </div>
            </div>

            <div>
                <div class="filter-bar">
                    <label style="font-weight:600; font-family:'Playfair Display', serif; color: var(--primary);">Filtrar Titular:</label>
                    <select id="filtroTitular" class="form-select" onchange="renderizarTablas()" style="max-width:260px;"><option value="TODOS">-- Todos --</option></select>
                    
                    <div style="display: flex; gap: 8px; margin-left: auto;" class="no-print">
                        <button type="button" class="btn-print" onclick="imprimirTitularActual()">🖨️ Imprimir Titular</button>
                        <button type="button" class="btn-print" onclick="imprimirTodo()">🖨️ Imprimir Todo</button>
                    </div>
                </div>
                <div id="contenedorGrupos"></div>
            </div>
        </div>
    </div>

    <footer><p>&copy; 2026 Espinoza y Asociados. Todos los derechos reservados.</p></footer>
</body>
</html>
